name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this runs
# the GoogleTest suite on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator has no timing
# model and cannot reproduce hardware-specific behavior, so it complements
# real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  push:
    branches: [verify-gpu-sim]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "cmake/**"
      - "*.hpp"
      - "*.h"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install GoogleTest and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtest-dev ninja-build

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@a1b9d4237411f9b2b0e0bb895b4d83377f336a7b # v0.1.9
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # 90-virtual embeds PTX only, which the simulator runs. The simulator
      # needs a shared CUDA runtime.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMM_BUILD_TESTING=ON \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared

      # gtest_discover_tests runs the test binary after linking, so the build
      # runs under the simulator too.
      - name: Build
        run: vgpu run --preload cmake --build build -j3

      # The suite has 9 tests. Fail unless ctest and the binary itself both
      # report all of them passing, and nothing was skipped.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          vgpu run ctest --test-dir build --output-on-failure --no-tests=error | tee ctest.log
          grep -q "100% tests passed, 0 tests failed out of 9" ctest.log
          vgpu run build/tests/fmm_cuda_tests | tee gtest.log
          grep -q "\[  PASSED  \] 9 tests" gtest.log
          if grep -Eqi "skipped|FAILED|CUDA error" gtest.log; then
            echo "::error::a test was skipped or failed"
            exit 1
          fi
